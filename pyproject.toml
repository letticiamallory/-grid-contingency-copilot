[project]
name = "grid-contingency-copilot"
version = "0.1.0"
description = "Copilot that suggests response steps for synthetic grid contingencies, with mandatory citation and explicit refusal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "pgvector",
    "httpx",
    "pydantic-settings",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL (docker compose up -d db)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
